name: Doel1 — test, build, deploy

on:
  push:
    branches: [claude/doel1-pwa-app-pu2xvh, claude/recipes-json-generator-7smhsz, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per branch een eigen groep: een run op de werk-branch mag nooit de
# Pages-deploy van de default branch annuleren.
concurrency:
  group: doel1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # De github-pages-environment laat alleen de default branch deployen;
  # op andere branches draait alleen build+test.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
