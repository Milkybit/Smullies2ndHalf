name: Doel1 — test, build, deploy

on:
  push:
    branches: [claude/doel1-pwa-app-pu2xvh, claude/recipes-json-generator-7smhsz, main]
    paths: ['doel1/**', '.github/workflows/doel1.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doel1-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doel1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doel1/dist

  # De github-pages-environment laat alleen de default branch deployen;
  # op andere branches draait alleen build+test.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
